# K8s Deployment - feed-service
# 注意: 镜像地址由 CI/CD 在部署时动态替换
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-service
  namespace: placeholder-namespace
  labels:
    app: feed-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feed-service
  template:
    metadata:
      labels:
        app: feed-service
        version: v1
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: feed-service
          image: 100.75.140.35:5000/pet-platform/feed-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "placeholder-env"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
