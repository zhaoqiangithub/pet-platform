# Kustomization - 生产环境
# 使用: kubectl apply -k infrastructure/k8s/overlays/prod

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pet-platform-prod

resources:
  - ../../feed-service
  - ../../frontend
  - namespace.yaml
  - image-pull-secret.yaml

# 环境特定配置
configMapGenerator:
  - name: feed-service-config
    behavior: replace
    literals:
      - SPRING_PROFILES_ACTIVE=prod
