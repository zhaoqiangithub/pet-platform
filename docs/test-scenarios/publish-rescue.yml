# 发布救助信息测试场景
name: 发布救助信息功能测试
description: 覆盖正常发布、位置获取、照片上传、审核等场景
priority: high
tags: [rescue, publish]

steps:
  - name: 正常发布救助信息
    given: 已完成实名认证的用户
    when: 填写动物类型、状态、位置（自动获取）、照片、联系方式，提交发布
    then: 信息进入审核，审核通过后显示在地图上

  - name: 自动获取位置
    given: 已登录用户
    when: 点击发布救助信息
    then: 自动获取当前位置并填入地址字段

  - name: 未实名认证无法发布
    given: 未完成实名认证的用户
    when: 尝试发布救助信息
    then: 提示“请先完成实名认证”，无法发布

  - name: 必填信息缺失
    given: 已认证用户
    when: 未填写动物类型或联系方式就提交
    then: 提示“请填写必填信息”，发布失败

  - name: 更新救助状态
    given: 已发布救助信息的用户
    when: 将状态从"待救助"更新为"已救助"
    then: 地图标记颜色改变，状态更新成功