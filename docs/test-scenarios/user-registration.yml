# 用户注册测试场景
name: 用户注册功能测试
description: 覆盖正常注册、手机号重复、验证码错误等场景
priority: high
tags: [authentication, registration]

steps:
  - name: 正常注册流程
    given: 新用户（手机号13800138000）
    when: 输入手机号、密码、验证码，点击注册
    then: 注册成功，自动登录，返回JWT令牌

  - name: 手机号已注册
    given: 手机号13800138000已被注册
    when: 输入该手机号注册
    then: 提示“该手机号已注册”，注册失败

  - name: 密码格式错误
    given: 新用户
    when: 输入不符合规范的密码（少于8位或不包含字母数字）
    then: 提示“密码需至少8位，含字母数字”，注册失败

  - name: 验证码错误
    given: 新用户
    when: 输入正确手机号和密码，但验证码错误
    then: 提示“验证码错误”，注册失败

  - name: 验证码过期
    given: 新用户
    when: 输入正确手机号和密码，但验证码已过期
    then: 提示“验证码已过期，请重新获取”，注册失败