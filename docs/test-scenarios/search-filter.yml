# 搜索与筛选测试场景
name: 搜索与筛选功能测试
description: 覆盖搜索、领养筛选、救助筛选等场景
priority: high
tags: [search, filter]

steps:
  - name: 关键字搜索
    given: 用户在搜索页面
    when: 输入关键字"柯基"并搜索
    then: 返回包含"柯基"的领养/救助信息列表

  - name: 领养筛选-多条件组合
    given: 用户在领养列表页
    when: 选择"狗"类型、"柯基"品种、"幼年"年龄、"母"性别
    then: 返回符合条件的领养信息，显示符合数量

  - name: 领养筛选-距离筛选
    given: 用户在领养列表页
    when: 选择"5km内"
    then: 返回距离5km内的领养信息

  - name: 救助筛选-紧急程度
    given: 用户在救助列表页
    when: 选择"紧急"
    then: 返回紧急救助信息，紧急信息置顶

  - name: 筛选结果分页
    given: 筛选结果超过20条
    when: 查看第一页后点击下一页
    then: 显示下一页筛选结果

  - name: 搜索无结果
    given: 用户搜索不存在的关键字
    when: 搜索"不存在的品种xyz"
    then: 显示"暂无相关内容"和推荐建议