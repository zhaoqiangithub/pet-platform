# 众筹功能测试场景
name: 众筹功能测试
description: 覆盖创建众筹、捐款、支付等场景
priority: medium
tags: [crowdfunding, payment]

steps:
  - name: 发起众筹
    given: 已完成实名认证的用户
    when: 填写目标金额、救助信息、医院名称、预算明细，提交众筹
    then: 众筹状态为"待审核"，1-2个工作日内完成审核

  - name: 捐款成功
    given: 爱心人士用户C
    when: 查看众筹详情，选择金额100元，使用微信支付
    then: 跳转支付，支付成功后显示捐款成功，获得积分奖励

  - name: 匿名捐款
    given: 爱心人士用户C
    when: 选择匿名捐款
    then: 捐款记录不显示用户名称，显示"匿名爱心人士"

  - name: 众筹成功
    given: 众筹达到目标金额
    when: 众筹截止时间到达或目标达成
    then: 资金直接支付给合作医院，通知捐款人

  - name: 众筹失败退款
    given: 众筹未达到目标金额
    when: 众筹截止
    then: 自动退款给捐款人，通知退款成功

  - name: 查看众筹进展
    given: 捐款用户
    when: 查看自己参与的众筹详情
    then: 显示当前已筹金额、捐款人数、资金使用情况