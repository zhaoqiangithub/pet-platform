# 举报功能测试场景
name: 举报功能测试
description: 覆盖举报提交、举报处理、黑名单等场景
priority: medium
tags: [report, block]

steps:
  - name: 举报虚假信息
    given: 用户A发现某领养信息为虚假信息
    when: 点击举报，选择"虚假信息"类型，填写详细说明，提交
    then: 举报提交成功，收到确认通知，7个工作日内处理

  - name: 举报描述过短
    given: 用户A举报某用户
    when: 填写举报描述少于20字就提交
    then: 提示"请详细描述问题（至少20字）"，提交失败

  - name: 举报并拉黑
    given: 用户A被用户B骚扰
    when: 举报用户B，选择同时拉黑
    then: 用户B被加入黑名单，举报同时提交

  - name: 查看黑名单
    given: 已拉黑其他用户的用户
    when: 进入设置查看黑名单
    then: 显示已拉黑的用户列表

  - name: 移除黑名单
    given: 已将用户B拉黑的用户A
    when: 在黑名单中移除用户B
    then: 用户B从黑名单中移除，可以正常发送消息

  - name: 恶意举报影响信用分
    given: 用户A被多次判定为恶意举报
    when: 查看信用分
    then: 信用分降低，收到通知