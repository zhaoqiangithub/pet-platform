# 实名认证测试场景
name: 实名认证功能测试
description: 覆盖实名认证申请、审核、查询等场景
priority: high
tags: [authentication, real-name]

steps:
  - name: 提交实名认证申请
    given: 已登录用户（未认证）
    when: 上传身份证照片，完成人脸识别，提交认证
    then: 认证状态变为"待审核"，收到确认通知

  - name: 查询认证状态
    given: 已提交认证申请的用户
    when: 查看个人认证状态
    then: 显示"待审核"，同时显示信用分（未加分）

  - name: 认证通过
    given: 实名认证审核通过
    when: 查看认证状态
    then: 状态变为"已认证"，信用分+10，收到通知

  - name: 认证被拒绝
    given: 实名认证审核未通过
    when: 查看认证状态
    then: 状态变为"已拒绝"，显示拒绝原因，收到通知

  - name: 未认证无法发布信息
    given: 未实名认证的用户
    when: 尝试发布救助/领养信息
    then: 提示“请先完成实名认证”，发布失败