# 用户登录测试场景
name: 用户登录功能测试
description: 覆盖正常登录、密码错误、手机号不存在、锁定等场景
priority: high
tags: [authentication, login]

steps:
  - name: 正常密码登录
    given: 已注册用户（手机号13800138000，密码Password123）
    when: 输入正确手机号和密码，点击登录
    then: 登录成功，返回JWT令牌，跳转到首页

  - name: 密码错误
    given: 已注册用户
    when: 输入正确手机号，错误密码
    then: 提示“密码错误”，登录失败，计数器+1

  - name: 手机号不存在
    given: 无此手机号
    when: 输入未注册手机号，任意密码
    then: 提示“手机号不存在”

  - name: 账户锁定
    given: 同一手机号连续5次密码错误
    when: 第6次尝试登录
    then: 提示“账户已锁定，请15分钟后再试”，登录失败

  - name: 验证码登录
    given: 已注册用户
    when: 点击验证码登录，输入手机号，获取验证码，输入正确验证码
    then: 登录成功，返回JWT令牌
