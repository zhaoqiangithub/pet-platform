# 志愿者任务测试场景
name: 志愿者任务功能测试
description: 覆盖任务认领、完成、评价、积分获取等场景
priority: medium
tags: [volunteer, task]

steps:
  - name: 认领救助任务
    given: 已认证的志愿者用户
    when: 在任务列表中选择一个任务，点击"认领"
    then: 任务状态变为"已认领"，任务分配给该志愿者

  - name: 提交任务完成
    given: 已认领任务的志愿者
    when: 完成救助后，上传完成证明照片，提交完成
    then: 任务状态变为"待确认"，等待发布者确认

  - name: 确认任务完成
    given: 任务发布者
    when: 查看已提交的完成申请，确认任务完成
    then: 任务状态变为"已完成"，志愿者获得积分奖励

  - name: 评价志愿者
    given: 任务发布者
    when: 任务完成后，对志愿者进行1-5星评价
    then: 评价成功，积分显示在志愿者主页

  - name: 查看积分记录
    given: 志愿者用户
    when: 进入个人中心查看积分
    then: 显示当前积分余额和积分获取/消费记录

  - name: 积分排行榜
    given: 任何用户
    when: 查看积分排行榜
    then: 显示周榜、月榜、年榜前50名用户

  - name: 每日签到
    given: 已登录用户
    when: 点击每日签到
    then: 签到成功，获得+2积分，连续签到可获得额外奖励