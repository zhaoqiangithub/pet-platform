openapi: 3.0.0
info:
  title: 用户服务API
  version: 1.0.0
  description: 管理用户注册、登录、个人信息等
servers:
  - url: https://api.petpal.com/v1
    description: 生产环境
  - url: http://localhost:8081/v1
    description: 本地开发

paths:
  /users/login:
    post:
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: "13800138000"
                password:
                  type: string
                  example: "Password123"
                verificationCode:
                  type: string
                  example: "123456"
              oneOf:
                - required: [phone, password]
                - required: [phone, verificationCode]
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIs..."
        "400":
          description: 请求参数错误
        "401":
          description: 认证失败（密码错误/账户锁定）
